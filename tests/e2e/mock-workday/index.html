<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Software Engineer — Acme Careers (mock Workday)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 760px; }
    [data-automation-id^="formField-"] { margin: 10px 0; }
    label { display: block; font-size: 13px; }
    input[type="text"], textarea { width: 320px; padding: 4px; }
    [data-automation-id="progressBar"] { display: flex; gap: 12px; list-style: none; padding: 0; font-size: 11px; }
    [data-automation-id="progressBarActiveStep"] { font-weight: bold; }
    [data-automation-id="selectedItemList"] { display: inline; padding: 0; }
    [data-automation-id="selectedItem"] { display: inline-block; background: #e5e7eb; margin: 2px; padding: 0 4px; }
    [role="option"] { cursor: pointer; padding: 2px 6px; }
    input[role="spinbutton"] { width: 56px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="/app.js"></script>
</body>
</html>
